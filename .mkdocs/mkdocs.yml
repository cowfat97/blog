site_name: how 的博客
site_description: Java 后端 & 大模型开发学习笔记
site_author: cowfat97
site_dir: ../../site
site_url: https://cowfat97.github.io/notes/
docs_dir: ".."
repo_url: https://github.com/cowfat97/notes
repo_name: cowfat97/notes
edit_uri: edit/main/

hooks:
  - hooks.py

exclude_docs: |
  README.md
  CLAUDE.md
  **/CLAUDE.md
  AGENTS.md
  **/AGENTS.md

not_in_nav: |
  公众号.md

plugins:
  - search

theme:
  name: material
  font: false
  language: zh
  favicon: Pic/avatar.jpeg
  icon:
    repo: fontawesome/brands/github
    logo: material/notebook-edit-outline
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换至暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换至亮色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.path
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

extra_css:
  - _components/wechat.css
  - _components/site.css

extra_javascript:
  - _components/catalog.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cowfat97
      name: GitHub
copyright: Copyright &copy; how

markdown_extensions:
  - md_in_html
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.snippets:
      base_path:
        - .
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - footnotes
  - toc
  - tables

# 知识目录由 hooks.py 在构建时生成，不回写源文件。
nav:
  - 首页: index.md
  - 笔记: 文章/index.md
  - 专题: 专题/index.md
  - 关于: about.md
