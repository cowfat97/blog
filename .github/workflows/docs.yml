name: Build and deploy notes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r .mkdocs/requirements.txt
      - name: Verify publication boundaries
        run: python -m unittest discover -s .mkdocs/tests -v
      - name: Build site
        run: mkdocs build -f .mkdocs/mkdocs.yml
      - name: Verify built pages and assets
        run: python .mkdocs/verify_site.py ../site
      - name: Deploy to existing gh-pages branch
        if: github.event_name != 'pull_request'
        run: mkdocs gh-deploy -f .mkdocs/mkdocs.yml --force
